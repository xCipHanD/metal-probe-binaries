name: Check precompiled screen observations
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Sampling scope
        type: choice
        options: [pilot, full, phase, cadence]
        default: pilot
      rounds:
        description: Repetitions
        type: choice
        options: ['2', '12', '24']
        default: '2'
permissions:
  contents: read
jobs:
  measure:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run and verify
        env:
          MTL_DEBUG_LAYER: '1'
        run: |
          set -euo pipefail
          shasum -a 256 -c MANIFEST.sha256
          mkdir -p artifacts
          { sw_vers; uname -m; launchctl managername; } > artifacts/runner.txt
          cp manifest.json artifacts/bundle-manifest.json
          chmod +x bin/window-screen
          bin/window-screen bin/window-screen.metallib '${{ inputs.rounds }}' '${{ inputs.mode }}' > artifacts/screen.stdout.txt 2> artifacts/screen.stderr.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: window-screen
          path: artifacts/
          retention-days: 14
