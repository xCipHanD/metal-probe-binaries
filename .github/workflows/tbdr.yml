name: Check and time TBDR features
on:
  workflow_dispatch:
    inputs:
      validation:
        description: Enable official Metal API Validation
        type: boolean
        default: false
      audit:
        description: Minimal original timer versus added waits
        type: boolean
        default: false
      responsive:
        description: Tile timer with short stop-check batches
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify binaries and probe TBDR
        env:
          MTL_DEBUG_LAYER: ${{ inputs.validation && '1' || '0' }}
        run: |
          set -euo pipefail
          shasum -a 256 -c MANIFEST.sha256
          test "$(uname -m)" = arm64
          mkdir -p artifacts
          { sw_vers; uname -m; } > artifacts/runner.txt
          printf 'MTL_DEBUG_LAYER=%s\n' "$MTL_DEBUG_LAYER" >> artifacts/runner.txt
          cp manifest.json artifacts/bundle-manifest.json
          chmod +x bin/tbdr-probe
          if [ '${{ inputs.audit }}' = true ]; then
            failed=0
            for tile in 0 1; do
              for kind in 2 0 1; do
                for threads in 64 1024; do
                  counts='10000000'
                  if [ "$kind" = 2 ]; then counts='1 1000 100000 1000000 10000000'; fi
                  for iterations in $counts; do
                  name="audit-${tile}-${kind}-${threads}-${iterations}"
                  if bin/tbdr-probe bin/tbdr-audit.metallib "$tile" "$kind" "$threads" "$iterations" > "artifacts/$name.csv" 2> "artifacts/$name.stderr.txt"; then
                    status=0
                  else
                    status=$?
                    failed=1
                  fi
                  printf '%s,%s\n' "$name" "$status" >> artifacts/audit-exits.csv
                  done
                done
              done
            done
            exit "$failed"
          fi
          if [ '${{ inputs.responsive }}' = true ]; then
            bin/tbdr-probe bin/tbdr-responsive-tile.metallib responsive > artifacts/tbdr-support.json 2> artifacts/probe.stderr.txt
          else
            bin/tbdr-probe bin/tbdr-tile.metallib > artifacts/tbdr-support.json 2> artifacts/probe.stderr.txt
          fi
          cat artifacts/tbdr-support.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: tbdr-probe
          path: artifacts/
          retention-days: 14
