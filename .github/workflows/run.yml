name: Run precompiled Metal probe
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      case:
        description: Frozen binary input case
        type: choice
        options: [smoke-original-0, pilot-original-0, full-original-0, full-random-1, diagnostic-original-0, ladder-pilot-0, ladder-full-0, ladder-full-1, tlb-pilot-0, tlb-full-0, tlb-full-1, cpu-pilot-0, cpu-full-0, cpu-full-1, two-batch-0]
        default: smoke-original-0
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CASE: ${{ inputs.case || 'smoke-original-0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify and run binaries
        run: |
          set -euo pipefail
          case "$CASE" in
            smoke-original-0|pilot-original-0|full-original-0|full-random-1|diagnostic-original-0|ladder-pilot-0|ladder-full-0|ladder-full-1|tlb-pilot-0|tlb-full-0|tlb-full-1|cpu-pilot-0|cpu-full-0|cpu-full-1|two-batch-0) ;;
            *) exit 2 ;;
          esac
          shasum -a 256 -c MANIFEST.sha256
          test "$(uname -m)" = arm64
          mkdir -p artifacts
          { sw_vers; uname -m; file bin/prefetch-tail; } > artifacts/runner.txt
          cp manifest.json artifacts/bundle-manifest.json
          printf '%s\n' "$CASE" > artifacts/case.txt
          HOST=bin/prefetch-tail
          LIB=bin/prefetch-tail.metallib
          case "$CASE" in ladder-*) HOST=bin/eviction-ladder; LIB=bin/eviction-ladder.metallib ;; esac
          case "$CASE" in tlb-*|cpu-*) HOST=bin/cache-controls; LIB=bin/cache-controls.metallib ;; esac
          case "$CASE" in two-batch-*) HOST=bin/two-batch; LIB=bin/two-batch.metallib ;; esac
          chmod +x "$HOST"
          gzip -dc "inputs/$CASE.bin.gz" > artifacts/input.bin
          "$HOST" artifacts/input.bin "$LIB" > artifacts/tail-raw.csv 2> artifacts/probe.stderr.txt
          tail -n 1 artifacts/probe.stderr.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: binary-probe-${{ env.CASE }}
          path: |
            artifacts/**/*.csv
            artifacts/**/*.json
            artifacts/**/*.txt
          retention-days: 14
