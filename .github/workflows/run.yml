name: Run precompiled Metal probe
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      case:
        description: Frozen binary input case
        type: choice
        options: [smoke-original-0, pilot-original-0, full-original-0, full-random-1, diagnostic-original-0, ladder-pilot-0, ladder-full-0, ladder-full-1, tlb-pilot-0, tlb-full-0, tlb-full-1, cpu-pilot-0, cpu-full-0, cpu-full-1, two-batch-0, two-batch-gap-0, two-batch-process-0, two-batch-colocation-0, two-batch-colocation-rewrite-0, pair-handshake-0, pair-handshake-size-0, matrix-handshake-16-0, matrix-handshake-8-0]
        default: smoke-original-0
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CASE: ${{ inputs.case || 'smoke-original-0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify and run binaries
        run: |
          set -euo pipefail
          case "$CASE" in
            smoke-original-0|pilot-original-0|full-original-0|full-random-1|diagnostic-original-0|ladder-pilot-0|ladder-full-0|ladder-full-1|tlb-pilot-0|tlb-full-0|tlb-full-1|cpu-pilot-0|cpu-full-0|cpu-full-1|two-batch-0|two-batch-gap-0|two-batch-process-0|two-batch-colocation-0|two-batch-colocation-rewrite-0|pair-handshake-0|pair-handshake-size-0|matrix-handshake-16-0|matrix-handshake-8-0) ;;
            *) exit 2 ;;
          esac
          shasum -a 256 -c MANIFEST.sha256
          test "$(uname -m)" = arm64
          mkdir -p artifacts
          { sw_vers; uname -m; file bin/prefetch-tail; } > artifacts/runner.txt
          cp manifest.json artifacts/bundle-manifest.json
          printf '%s\n' "$CASE" > artifacts/case.txt
          HOST=bin/prefetch-tail
          LIB=bin/prefetch-tail.metallib
          case "$CASE" in ladder-*) HOST=bin/eviction-ladder; LIB=bin/eviction-ladder.metallib ;; esac
          case "$CASE" in tlb-*|cpu-*) HOST=bin/cache-controls; LIB=bin/cache-controls.metallib ;; esac
          case "$CASE" in two-batch-*) HOST=bin/two-batch; LIB=bin/two-batch.metallib ;; esac
          case "$CASE" in pair-handshake-*) HOST=bin/pair-handshake; LIB=bin/pair-handshake.metallib ;; esac
          case "$CASE" in matrix-handshake-*) HOST=bin/matrix-handshake; LIB=bin/matrix-handshake.metallib ;; esac
          chmod +x "$HOST"
          gzip -dc "inputs/$CASE.bin.gz" > artifacts/input.bin
          "$HOST" artifacts/input.bin "$LIB" > artifacts/tail-raw.csv 2> artifacts/probe.stderr.txt
          tail -n 1 artifacts/probe.stderr.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Back up results in job log
        if: always()
        run: |
          set -euo pipefail
          test -d artifacts || exit 0
          cd artifacts
          shopt -s nullglob
          files=(*.csv *.json *.txt)
          test "${#files[@]}" -gt 0 || exit 0
          tar -czf "$RUNNER_TEMP/probe-results.tgz" "${files[@]}"
          printf 'PROBE_RESULTS_SHA256 '
          shasum -a 256 "$RUNNER_TEMP/probe-results.tgz"
          printf 'PROBE_RESULTS_BASE64_BEGIN\n'
          base64 -b 120 -i "$RUNNER_TEMP/probe-results.tgz"
          printf '\nPROBE_RESULTS_BASE64_END\n'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: binary-probe-${{ env.CASE }}
          path: |
            artifacts/**/*.csv
            artifacts/**/*.json
            artifacts/**/*.txt
          retention-days: 14
