name: Run precompiled Metal probe
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      case:
        description: Frozen binary input case
        type: choice
        options: [smoke-original-0, pilot-original-0, full-original-0, full-random-1, diagnostic-original-0]
        default: smoke-original-0
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CASE: ${{ inputs.case || 'smoke-original-0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify and run binaries
        run: |
          set -euo pipefail
          case "$CASE" in
            smoke-original-0|pilot-original-0|full-original-0|full-random-1|diagnostic-original-0) ;;
            *) exit 2 ;;
          esac
          shasum -a 256 -c MANIFEST.sha256
          test "$(uname -m)" = arm64
          mkdir -p artifacts
          { sw_vers; uname -m; file bin/prefetch-tail; } > artifacts/runner.txt
          cp manifest.json artifacts/bundle-manifest.json
          printf '%s\n' "$CASE" > artifacts/case.txt
          chmod +x bin/prefetch-tail
          gzip -dc "inputs/$CASE.bin.gz" > artifacts/input.bin
          ./bin/prefetch-tail artifacts/input.bin bin/prefetch-tail.metallib > artifacts/tail-raw.csv 2> artifacts/probe.stderr.txt
          tail -n 1 artifacts/probe.stderr.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: binary-probe-${{ env.CASE }}
          path: |
            artifacts/**/*.csv
            artifacts/**/*.json
            artifacts/**/*.txt
          retention-days: 14
