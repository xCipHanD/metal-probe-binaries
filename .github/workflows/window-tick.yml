name: Measure precompiled window paths
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Window configuration
        default: opacity
        type: choice
        options: [probe, opacity]
      rounds:
        description: Randomized rounds
        default: '2'
        type: choice
        options: ['2', '24']
permissions:
  contents: read
jobs:
  measure:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run and verify
        env:
          MTL_DEBUG_LAYER: '1'
        run: |
          set -euo pipefail
          shasum -a 256 -c MANIFEST.sha256
          test "$(uname -m)" = arm64
          mkdir -p artifacts
          { sw_vers; uname -m; launchctl managername; } > artifacts/runner.txt
          cp manifest.json artifacts/bundle-manifest.json
          chmod +x bin/window-tick
          bin/window-tick bin/window-tick.metallib '${{ inputs.rounds }}' '${{ inputs.mode }}' > artifacts/window.stdout.txt 2> artifacts/window.stderr.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: window-tick
          path: artifacts/
          retention-days: 14
